services:
  es01:
    image: elasticsearch:8.19.15
    container_name: es01
    hostname: es01
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
#      - ./data/elastic/elasticsearch/es01/config:/usr/share/elasticsearch/config
      - ./data/elastic/elasticsearch/es01/data:/usr/share/elasticsearch/data
      - ./data/elastic/elasticsearch/es01/logs:/usr/share/elasticsearch/logs
      - ./data/elastic/elasticsearch/es01/plugins:/usr/share/elasticsearch/plugins
    networks:
      starry:
        ipv4_address: 172.18.7.1
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - node.name=es01
      - cluster.name=starry-cluster
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 1G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 | grep -q 'version'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    image: kibana:8.19.15
    container_name: kibana
    hostname: kibana
    restart: always
    ports:
      - "5601:5601"
    volumes:
      - ./data/elastic/kibana/data:/usr/share/kibana/data
    networks:
      starry:
        ipv4_address: 172.18.7.2
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    depends_on:
      es01:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601/app/home | grep -q 'HTTP/1.1 200 OK'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120