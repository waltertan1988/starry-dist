services:
  kafka-controller-1:
    image: apache/kafka:4.3.1
    hostname: kafka-controller-1
    container_name: kafka-controller-1
    volumes:
      - ./data/kafka/cluster-isolated/controller1/config:/mnt/shared/config
      - ./data/kafka/cluster-isolated/controller1/kraft-controller-logs:/opt/kafka/kraft-controller-logs
    networks:
      starry:
        ipv4_address: 172.18.3.1
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093'
      #KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: 'kafka-controller-1:9093,kafka-controller-2:9093,kafka-controller-3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'CONTROLLER://:9093'
      CLUSTER_ID: 'starry-kafka4-cluster-isolated'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-controller-logs'
  
  kafka-controller-2:
    image: apache/kafka:4.3.1
    hostname: kafka-controller-2
    container_name: kafka-controller-2
    volumes:
      - ./data/kafka/cluster-isolated/controller2/config:/mnt/shared/config
      - ./data/kafka/cluster-isolated/controller2/kraft-controller-logs:/opt/kafka/kraft-controller-logs
    networks:
      starry:
        ipv4_address: 172.18.3.2
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093'
      #KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: 'kafka-controller-1:9093,kafka-controller-2:9093,kafka-controller-3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'CONTROLLER://:9093'
      CLUSTER_ID: 'starry-kafka4-cluster-isolated'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-controller-logs'

  kafka-controller-3:
    image: apache/kafka:4.3.1
    hostname: kafka-controller-3
    container_name: kafka-controller-3
    volumes:
      - ./data/kafka/cluster-isolated/controller3/config:/mnt/shared/config
      - ./data/kafka/cluster-isolated/controller3/kraft-controller-logs:/opt/kafka/kraft-controller-logs
    networks:
      starry:
        ipv4_address: 172.18.3.3
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093'
      #KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: 'kafka-controller-1:9093,kafka-controller-2:9093,kafka-controller-3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'CONTROLLER://:9093'
      CLUSTER_ID: 'starry-kafka4-cluster-isolated'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-controller-logs'

  kafka-broker-1:
    image: apache/kafka:4.3.1
    ports:
      - "29092:9092"
    hostname: kafka-broker-1
    container_name: kafka-broker-1
    volumes:
      - ./data/kafka/cluster-isolated/broker1/config:/mnt/shared/config
      - ./data/kafka/cluster-isolated/broker1/kraft-broker-logs:/opt/kafka/kraft-broker-logs
    networks:
      starry:
        ipv4_address: 172.18.3.4
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093'
      #KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: 'kafka-controller-1:9093,kafka-controller-2:9093,kafka-controller-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-1:19092,PLAINTEXT_HOST://${DOCKER_HOST}:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'starry-kafka4-cluster-isolated'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-broker-logs'
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

  kafka-broker-2:
    image: apache/kafka:4.3.1
    ports:
      - "39092:9092"
    hostname: kafka-broker-2
    container_name: kafka-broker-2
    volumes:
      - ./data/kafka/cluster-isolated/broker2/config:/mnt/shared/config
      - ./data/kafka/cluster-isolated/broker2/kraft-broker-logs:/opt/kafka/kraft-broker-logs
    networks:
      starry:
        ipv4_address: 172.18.3.5
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093'
      #KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: 'kafka-controller-1:9093,kafka-controller-2:9093,kafka-controller-3:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-2:19092,PLAINTEXT_HOST://${DOCKER_HOST}:39092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'starry-kafka4-cluster-isolated'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-broker-logs'
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

  kafka-broker-3:
    image: apache/kafka:4.3.1
    ports:
      - "49092:9092"
    hostname: kafka-broker-3
    container_name: kafka-broker-3
    volumes:
      - ./data/kafka/cluster-isolated/broker3/config:/mnt/shared/config
      - ./data/kafka/cluster-isolated/broker3/kraft-broker-logs:/opt/kafka/kraft-broker-logs
    networks:
      starry:
        ipv4_address: 172.18.3.6
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093'
      #KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: 'kafka-controller-1:9093,kafka-controller-2:9093,kafka-controller-3:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-3:19092,PLAINTEXT_HOST://${DOCKER_HOST}:49092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'starry-kafka4-cluster-isolated'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-broker-logs'
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3