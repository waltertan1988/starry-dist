services:
  redis-master:
    image: redis:8.2.7
    container_name: redis-master
    hostname: redis-master
    volumes:
      - ./data/redis/sentinel/master/conf:/usr/local/etc/redis
      - ./data/redis/sentinel/master/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf --port 6379"
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.20'

  redis-slave1:
    image: redis:8.2.7
    container_name: redis-slave1
    hostname: redis-slave1
    volumes:
      - ./data/redis/sentinel/slave1/conf:/usr/local/etc/redis
      - ./data/redis/sentinel/slave1/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf --port 6380 --replicaof ${DOCKER_HOST} 6379"
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6380 -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'

