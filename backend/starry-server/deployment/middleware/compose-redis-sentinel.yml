      - ./data/redis/sentinel/stl1:/usr/local/etc/redis
     # 首次部署时，指定mymaster的主节点，后续启动时无需指定了（配置文件已被自动rewrite）
#    command: bash -c "redis-sentinel /usr/local/etc/redis/sentinel.conf --port 26379 --sentinel monitor mymaster ${DOCKER_HOST} 6379 2"
    command: bash -c "redis-sentinel /usr/local/etc/redis/sentinel.conf --port 26379"
