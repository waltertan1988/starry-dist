      HEAP_OPTS: -Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m
    depends_on:
      - rmq-namesrv-1
      - rmq-namesrv-2
      - rmq-namesrv-3
    networks:
      starry:
        ipv4_address: 172.18.3.6
    command: ["sh","mqbroker","-c","/home/rocketmq/conf/broker.conf"]
  rmq-broker-b2:
    image: apache/rocketmq:${ROCKET_MQ_VERSION}
