      - ./data/rocketmq/controller/brokerb2/logs:/home/rocketmq/logs
      - ./data/rocketmq/controller/brokerb2/store:/home/rocketmq/store
    environment:
      NAMESRV_ADDR: rmqnamesrv1:9876;rmqnamesrv2:9876;rmqnamesrv3:9876
      HEAP_OPTS: -Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=128m
