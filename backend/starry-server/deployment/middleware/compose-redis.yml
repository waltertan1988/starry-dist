services:
  redisinsight:
    image: redis/redisinsight:3.6.0
    container_name: redisinsight
    hostname: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - ./data/redis/redisinsight:/data
    networks:
      starry:
        ipv4_address: 172.18.2.0
    healthcheck:
      test: [ "CMD-SHELL", "netstat -tnpl | grep -qE '(\\s)+([0-9]{1,3}\\.){3}[0-9]{1,3}:5540(\\s)+' || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.20'

  redis-master:
    image: redis:8.2.7
    container_name: redis-master
    hostname: redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis/sentinel/master/conf:/usr/local/etc/redis
      - ./data/redis/sentinel/master/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      starry:
        ipv4_address: 172.18.2.1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.20'

  redis-slave1:
    image: redis:8.2.7
    container_name: redis-slave1
    hostname: redis-slave1
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis/sentinel/slave1/conf:/usr/local/etc/redis
      - ./data/redis/sentinel/slave1/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      starry:
        ipv4_address: 172.18.2.2
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - redis-master
    deploy:
      resources:
        limits:
          cpus: '0.20'

  redis-slave2:
    image: redis:8.2.7
    container_name: redis-slave2
    hostname: redis-slave2
    ports:
      - "6381:6379"
    volumes:
      - ./data/redis/sentinel/slave2/conf:/usr/local/etc/redis
      - ./data/redis/sentinel/slave2/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      starry:
        ipv4_address: 172.18.2.3
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      - redis-master
    deploy:
      resources:
        limits:
          cpus: '0.20'