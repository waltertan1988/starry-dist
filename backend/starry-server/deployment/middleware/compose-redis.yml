  redis-single:
    image: redis:8.2.7
    container_name: redis-single
    hostname: redis-single
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis/single/conf:/usr/local/etc/redis
      - ./data/redis/single/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      starry:
        ipv4_address: 172.18.2.1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.20'
