services:
  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack
    hostname: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./data/redis:/data
    networks:
      starry:
        ipv4_address: 172.18.2.1
    deploy:
      resources:
        limits:
          cpus: '0.20'