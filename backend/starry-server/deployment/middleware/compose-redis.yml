services:
  redisinsight:
    image: redis/redisinsight:3.6.0
    container_name: redisinsight
    hostname: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - ./data/redis/redisinsight:/data
    networks:
      starry:
        ipv4_address: 172.18.2.0
    healthcheck:
      test: [ "CMD-SHELL", "netstat -tnpl | grep -qE '(\\s)+([0-9]{1,3}\\.){3}[0-9]{1,3}:5540(\\s)+' || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.20'

include:
#  - compose-redis-replication.yml
#  - compose-redis-sentinel.yml
  - compose-redis-cluster.yml