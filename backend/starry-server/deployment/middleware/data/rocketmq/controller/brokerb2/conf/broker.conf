brokerClusterName = DefaultCluster
brokerName = broker-b

# 主服务端口
listenPort=13911
# 高可用端口
haListenPort=13912
# 快速通信端口（可选）
fastListenPort=13909

# 启用Controller模式
enableControllerMode = true
controllerAddr = rmqnamesrv1:9878;rmqnamesrv2:9878;rmqnamesrv3:9878

# 自动主备切换模式下 Broker 无需指定 brokerId 和 brokerRole，其由 Controller 组件进行分配
brokerId = -1
brokerRole = SLAVE

deleteWhen = 04
fileReservedTime = 48
flushDiskType = ASYNC_FLUSH
namesrvAddr = rmqnamesrv1:9876;rmqnamesrv2:9876;rmqnamesrv3:9876
# 若该值为 true，则一条消息需要复制到 SyncStateSet 中的每一个副本才会向客户端返回成功，可以保证消息不丢失。默认为 false
allAckInSyncStateSet=true

# 需按宿主机IP修改此配置
brokerIP1 = 192.168.100.42
# 是否自动创建主题，生产环境建议禁用
autoCreateTopicEnable = true