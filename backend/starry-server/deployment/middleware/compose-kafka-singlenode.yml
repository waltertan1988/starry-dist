services:
  kafka-broker:
    image: apache/kafka:4.3.1
    hostname: kafka-broker
    container_name: kafka-broker
    ports:
      - "9092:9092"
    volumes:
      - ./data/kafka/singlenode/config:/mnt/shared/config
      - ./data/kafka/singlenode/kraft-combined-logs:/opt/kafka/kraft-combined-logs
    networks:
      starry:
        ipv4_address: 172.18.3.1
    deploy:
      resources:
        limits:
          cpus: '0.20'
    environment:
      # Environment variables used by kafka scripts will be needed in case of File input.
      CLUSTER_ID: 'starry-kafka4-singlenode'
      # Set properties not provided or override an existing property in the file input
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://${DOCKER_HOST}:9092,PLAINTEXT://kafka-broker:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/opt/kafka/kraft-combined-logs'
