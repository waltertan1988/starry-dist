services:
  redis-master:
    image: redis:8.2.7
    container_name: redis-master
    hostname: redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis/replication/master/conf:/usr/local/etc/redis
      - ./data/redis/replication/master/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      starry:
        ipv4_address: 172.18.2.1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.20'

  redis-slave1:
    image: redis:8.2.7
    container_name: redis-slave1
    hostname: redis-slave1
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis/replication/slave1/conf:/usr/local/etc/redis
      - ./data/redis/replication/slave1/data:/data
    command: bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      starry:
        ipv4_address: 172.18.2.2
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.20'
