app:
  # 中间件所在主机（仅用于集中管理本配置文件上下文的配置，非必须）
  middleware-host: 192.168.100.42

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: starry-business-app

  config:
    import:
      - classpath:application-security.yml
      - classpath:application-ds.yml
      - classpath:application-redis.yml
      - classpath:application-kafka.yml
#      - classpath:application-rocketmq.yml
#      - classpath:application-pulsar.yml
      - classpath:application-es.yml
      - classpath:application-ai.yml

  # 优雅停机的宽限期
  lifecycle:
    timeout-per-shutdown-phase: 120s

  # springboot启用虚拟线程
  threads:
    virtual:
      enabled: true

  main:
    # 启用虚拟线程后，由于虚拟线程都是守护线程，为防止JVM因没有非守护线程而自动退出，需要设置此值为true
    #（参考：https://docs.spring.io/spring-boot/docs/current/reference/html/features.html#features.spring-application.virtual-threads）
    keep-alive: true
    # 允许Spring循环依赖
    allow-circular-references: true

logging:
  pattern:
    console: "[%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%level){blue} %clr([%X{starry-traceId}]){yellow} %clr([%thread]){orange} %clr(%logger){cyan}%clr([%L]){yellow} %m%n}"
#  level:
#    org.springframework.security: trace

management:
  endpoints:
    web:
      exposure:
        # 暴露health端点，可供Nginx或容器探针进行健康检查，实现无损上下线
        #        include: "health"
        include: "*"
#  endpoint:
#    shutdown:
#      access: unrestricted